<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ричикс</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Абстрактный жидкостный фон */
        .liquid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 12s infinite ease-in-out alternate;
        }

        .blob1 {
            width: 50vw;
            height: 50vw;
            background: #ffffff;
            top: -10%;
            left: -10%;
        }

        .blob2 {
            width: 40vw;
            height: 40vw;
            background: #333333;
            bottom: -20%;
            right: -10%;
            animation-duration: 15s;
            animation-direction: alternate-reverse;
        }

        .blob3 {
            width: 35vw;
            height: 35vw;
            background: #777777;
            top: 30%;
            left: 40%;
            animation-duration: 18s;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(15vw, 10vh) scale(1.3); }
        }

        /* Эффект стекла поверх фона */
        .glass-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2;
        }

        /* Контейнер с контентом */
        .content {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Неоновый текст */
        .neon-title {
            color: #fff;
            margin: 0;
            font-size: 5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #fff,
                0 0 40px rgba(255, 255, 255, 0.8),
                0 0 80px rgba(255, 255, 255, 0.5);
        }

        .neon-subtitle {
            color: #fff;
            margin: 0;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-shadow:
                0 0 3px #fff,
                0 0 8px #fff,
                0 0 15px rgba(255, 255, 255, 0.7);
        }

        /* Кнопка Telegram */
        .tg-btn {
            margin-top: 30px;
            padding: 12px 35px;
            font-size: 1.1rem;
            color: #000;
            background-color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            border: 2px solid #fff;
        }

        .tg-btn:hover {
            background-color: transparent;
            color: #fff;
            box-shadow: 
                0 0 25px rgba(255, 255, 255, 0.9), 
                inset 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Адаптация под мобилки */
        @media (max-width: 768px) {
            .neon-title { font-size: 3rem; }
            .neon-subtitle { font-size: 1.2rem; }
            .tg-btn { padding: 10px 25px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Задний фон с жидкостью -->
    <div class="liquid-bg">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>
    
    <!-- Матовое стекло -->
    <div class="glass-overlay"></div>

    <!-- Основной контент -->
    <div class="content">
        <h1 class="neon-title">ричикс</h1>
        <h2 class="neon-subtitle">14 y.o</h2>
        <a href="https://t.me/lagnone" class="tg-btn" target="_blank">Telegram</a>
    </div>

</body>
</html>
